Concierto vista Alegre

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵 ConciertoJuntos · España</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: sans-serif; }
html, body { height:100%; }
#mapa { height:55%; width:100%; }
#panel { height:45%; width:100%; background:#f5f5f5; display:flex; flex-direction:column; }
#cabecera { background:#6366f1; color:white; padding:12px; text-align:center; font-weight:bold; }
#chat { flex:1; padding:10px; overflow-y:auto; font-size:14px; }
.mensaje { margin:4px 0; padding:6px 10px; background:white; border-radius:16px; max-width:85%; box-shadow:0 1px 2px rgba(0,0,0,0.1); }
.nombre { font-weight:bold; color:#4f46e5; }
#entrada { display:flex; padding:10px; gap:8px; border-top:1px solid #ddd; }
input { flex:1; padding:10px; border:1px solid #ccc; border-radius:20px; font-size:14px; }
button { padding:10px 18px; background:#6366f1; color:white; border:none; border-radius:20px; cursor:pointer; font-weight:bold; }
button:hover { background:#4f46e5; }
#nombrePanel { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; align-items:center; justify-content:center; z-index:1000; }
#nombreCaja { background:white; padding:30px; border-radius:12px; text-align:center; max-width:90%; }
#nombreCaja h2 { margin-bottom:15px; color:#4f46e5; }
#nombreCaja input { margin-bottom:15px; width:100%; }
.mio { background:#e0e7ff; margin-left:auto; }
.boton-centrar { position:absolute; top:10px; right:10px; z-index:100; background:white; border:none; padding:8px 12px; border-radius:6px; box-shadow:0 2px 6px rgba(0,0,0,0.2); cursor:pointer; font-size:14px; }
.boton-centrar:hover { background:#f0f0f0; }
</style>
</head>
<body>

<!-- Pantalla de entrada -->
<div id="nombrePanel">
<div id="nombreCaja">
<h2>🎵 ConciertoJuntos</h2>
<p>📍 Palacio Vistalegre Arena · En toda España</p>
<p>Escribe tu nombre para entrar:</p>
<input type="text" id="miNombre" placeholder="Tu nombre">
<button onclick="entrar()">¡Entrar!</button>
</div>
</div>

<!-- Mapa con botón de centrado -->
<div id="mapa">
<button class="boton-centrar" onclick="centrarEnVistalegre()">🏟️ Vistalegre</button>
</div>

<!-- Panel Chat -->
<div id="panel">
<div id="cabecera">💬 Chat · Grupo de Amigos</div>
<div id="chat"></div>
<div id="entrada">
<input type="text" id="mensaje" placeholder="Escribe un mensaje..." onkeypress="if(event.key==='Enter') enviarMsg()">
<button onclick="enviarMsg()">Enviar</button>
</div>
</div>

<script>
let miNombre = "";
let mapa = null;
let ubicacionRef = null;
let chatRef = null;
let marcadores = {};

// 📍 Punto de referencia
const VISTALEGRE_LAT = 40.3825;
const VISTALEGRE_LNG = -3.7225;
const ZOOM_PAIS = 6; // Vista España entera
const ZOOM_RECINTO = 17; // Precisión dentro del recinto

// 🔧 TU CONFIGURACIÓN DE FIREBASE
const firebaseConfig = {
apiKey: "TU_API_KEY",
authDomain: "TU_PROYECTO.firebaseapp.com",
databaseURL: "https://TU_PROYECTO-default-rtdb.europe-west1.firebasedatabase.app",
projectId: "TU_PROYECTO",
storageBucket: "TU_PROYECTO.appspot.com",
messagingSenderId: "TU_ID",
appId: "TU_APP_ID"
};

const app = firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function entrar() {
miNombre = document.getElementById("miNombre").value.trim();
if (!miNombre) { alert("Escribe tu nombre 👆"); return; }

document.getElementById("nombrePanel").style.display = "none";

ubicacionRef = db.ref("ubicaciones");
chatRef = db.ref("chat");

// 🗺️ Mapa inicial: España entera
mapa = L.map('mapa').setView([40.4168, -3.7038], ZOOM_PAIS);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
attribution: '© OpenStreetMap'
}).addTo(mapa);

// 🏟️ Marcador permanente del recinto
const iconoRecinto = L.icon({
iconUrl: 'https://cdn-icons-png.flaticon.com/512/684/684908.png',
iconSize: [30, 30],
iconAnchor: [15, 30]
});
L.marker([VISTALEGRE_LAT, VISTALEGRE_LNG], { icon: iconoRecinto })
.addTo(mapa)
.bindPopup('<b>🏟️ Palacio Vistalegre Arena</b><br>Punto de encuentro')
.openPopup();

iniciarGPS();

// 🔄 Actualizar posiciones de todos
ubicacionRef.on("value", snapshot => {
const datos = snapshot.val() || {};
for (let nombre in datos) {
const p = datos[nombre];
if (!marcadores[nombre]) {
marcadores[nombre] = L.marker([p.lat, p.lng])
.addTo(mapa)
.bindPopup(nombre);
} else {
marcadores[nombre].setLatLng([p.lat, p.lng]);
}
}
// Eliminar quienes salieron
for (let nombre in marcadores) {
if (!datos[nombre]) {
mapa.removeLayer(marcadores[nombre]);
delete marcadores[nombre];
}
}
});

// 💬 Recibir mensajes
chatRef.limitToLast(50).on("child_added", snapshot => {
const msg = snapshot.val();
const div = document.createElement("div");
div.className = "mensaje " + (msg.nombre === miNombre ? "mio" : "");
div.innerHTML = <span class="nombre"&gt;${msg.nombre}:</span> ${msg.texto};
document.getElementById("chat").appendChild(div);
document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
});
}

// 📍 GPS con precisión alta automática
function iniciarGPS() {
if (!navigator.geolocation) { alert("Tu navegador no soporta ubicación"); return; }

navigator.geolocation.watchPosition(
posicion => {
const lat = posicion.coords.latitude;
const lng = posicion.coords.longitude;
const precision = posicion.coords.accuracy; // en metros

// Guardar posición
ubicacionRef.child(miNombre).set({ lat, lng, precision });

// 🎯 Si estás cerca del recinto → acercar mapa automáticamente
const distancia = calcularDistancia(lat, lng, VISTALEGRE_LAT, VISTALEGRE_LNG);
if (distancia < 0.5) { // A menos de 500 metros
mapa.setView([lat, lng], ZOOM_RECINTO);
}
},
error => {
console.log("Error GPS:", error);
alert("No se pudo acceder a tu ubicación. Revisa los permisos del navegador.");
},
{ enableHighAccuracy: true, maximumAge: 3000, timeout: 8000 }
);
}

// 📏 Calcular distancia entre dos puntos (km)
function calcularDistancia(lat1, lon1, lat2, lon2) {
const R = 6371; // radio de la Tierra en km
const dLat = (lat2 - lat1) * Math.PI / 180;
const dLon = (lon2 - lon1) * Math.PI / 180;
const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
Math.sin(dLon/2) * Math.sin(dLon/2);
return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// 🏟️ Botón para volver al recinto
function centrarEnVistalegre() {
mapa.setView([VISTALEGRE_LAT, VISTALEGRE_LNG], ZOOM_RECINTO);
}

function enviarMsg() {
const texto = document.getElementById("mensaje").value.trim();
if (!texto) return;
chatRef.push({ nombre: miNombre, texto, hora: Date.now() });
document.getElementById("mensaje").value = "";
}

// 🧹 Limpiar al salir
window.addEventListener("beforeunload", () => {
if (ubicacionRef && miNombre) ubicacionRef.child(miNombre).remove();
});

</script>
</body>
</html>
