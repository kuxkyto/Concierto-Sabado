
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba Ubicación</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    button { font-size: 18px; padding: 15px 30px; background: #25D366; color: white; border: none; border-radius: 8px; cursor: pointer; }
    #map { width: 100%; height: 300px; margin-top: 20px; border-radius: 8px; background: #eee; }
  </style>
</head>
<body>
  <h2>📍 Prueba de Ubicación</h2>
  <p>Pulsa el botón y acepta cuando te lo pida</p>
  <button onclick="obtenerUbicacion()">Compartir mi ubicación</button>
  <div id="map"></div>
  <p id="estado"></p>

  <script>
    function obtenerUbicacion() {
      if (navigator.geolocation) {
        document.getElementById('estado').innerText = "🔄 Solicitando ubicación...";
        navigator.geolocation.getCurrentPosition(
          function(posicion) {
            // Éxito: usuario pulsó "Permitir"
            const lat = posicion.coords.latitude;
            const lng = posicion.coords.longitude;
            document.getElementById('estado').innerHTML = 
              `✅ ¡Permiso aceptado!\\nLat: ${lat.toFixed(6)}\\nLon: ${lng.toFixed(6)}`;
            // Mostrar en mapa
            document.getElementById('map').innerHTML = 
              `<iframe width="100%" height="100%" src="https://www.google.com/maps?q=${lat},${lng}&z=16&output=embed"></iframe>`;
          },
          function(error) {
            // El usuario pulsó "Bloquear" o denegó el permiso
            document.getElementById('estado').innerText = 
              "❌ Permiso denegado. Tú tuviste que pulsar 'Permitir'.";
          }
        );
      } else {
        document.getElementById('estado').innerText = 
          "❌ Tu navegador no soporta geolocalización";
      }
    }
  </script>
</body>
</html>
